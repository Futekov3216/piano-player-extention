<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 14px;
        font:
          13px system-ui,
          sans-serif;
        background: #1d1b22;
        color: #eee;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 8px;
        border: 1px solid #555;
        border-radius: 6px;
        background: #2a2730;
        color: #eee;
        font: inherit;
      }
      .row {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      button {
        flex: 1;
        padding: 7px;
        border: 0;
        border-radius: 6px;
        font: inherit;
        cursor: pointer;
        background: #7a5cff;
        color: #fff;
      }
      button.secondary {
        background: #444;
      }
      button[hidden] {
        display: none;
      }
      .hint {
        color: #999;
        font-size: 11px;
        margin: 8px 0 0;
      }
      #status {
        margin-top: 10px;
        white-space: pre-wrap;
        font-size: 12px;
        line-height: 1.4;
      }
      #status.error {
        color: #ff8a8a;
      }
      details {
        margin-top: 12px;
        border: 1px solid #444;
        border-radius: 6px;
        background: #25222b;
      }
      summary {
        padding: 7px 8px;
        cursor: pointer;
        user-select: none;
      }
      #history {
        list-style: none;
        margin: 0;
        padding: 0 4px 4px;
        max-height: 180px;
        overflow-y: auto;
      }
      #history li {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 5px 6px;
        border-radius: 4px;
        cursor: pointer;
      }
      #history li:hover {
        background: #34303c;
      }
      #history .seed {
        font-family: ui-monospace, monospace;
      }
      #history .meta {
        color: #999;
        font-size: 11px;
        text-align: right;
      }
      #history .empty {
        color: #999;
        cursor: default;
      }
      #history .empty:hover {
        background: none;
      }
      #clear-history {
        margin: 0 8px 8px;
        width: calc(100% - 16px);
        padding: 5px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Piano Player</h1>
    <input id="seed" placeholder="Type a seed, or just press Play" autofocus />
    <div class="row">
      <button id="play">Play</button>
      <button id="stop" class="secondary">Stop</button>
    </div>
    <div class="row">
      <button id="reload" class="secondary" hidden>Reload page</button>
    </div>
    <div class="row">
      <button id="open" class="secondary">Go to virtual piano</button>
    </div>
    <p class="hint">Click one piano key on the page first to unlock sound.</p>
    <div id="status"></div>
    <details id="history-panel">
      <summary>Played seeds (<span id="history-count">0</span>)</summary>
      <ul id="history"></ul>
      <button id="clear-history" class="secondary">Clear history</button>
    </details>
    <script src="popup.js"></script>
  </body>
</html>
